<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practice exam questions and flashcards for Chapters 1–5 of the Florida Real Estate Sales Associate pre-license course, with answers and explanations.">
<title>Florida Sales Associate Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column of three labeled sections (Setup, Question, Progress); grayscale only */
:root{
  --bg:#f7f7f7; --surface:#ffffff; --ink:#151515; --muted:#6e6e6e; --line:#dcdcdc; --soft:#efefef;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1b1b1b; --ink:#ececec; --muted:#9a9a9a; --line:#333333; --soft:#262626; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1b1b1b; --ink:#ececec; --muted:#9a9a9a; --line:#333333; --soft:#262626; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px;padding-bottom:20px;border-bottom:1px solid var(--line)}
h1{font-weight:600;font-size:clamp(24px,5vw,30px);line-height:1.2;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:15px}

.section{display:flex;flex-direction:column;gap:12px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}

/* Setup */
.setup .row{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;padding:12px 16px}
.setup .row + .row{border-top:1px solid var(--line)}
.setup .key{font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 12px;border-radius:6px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{font-family:var(--f-mono);font-size:12px;opacity:.6;margin-left:6px}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Question */
.card{padding:20px;display:flex;flex-direction:column;gap:18px}
.qtext{font-weight:500;font-size:clamp(18px,4vw,20px);line-height:1.4;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 14px;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-family:var(--f-mono);color:var(--muted)}
.opt .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.opt.sel{border-color:var(--ink);background:var(--soft)}
.opt.right{border:2px solid var(--ink);padding:10px 13px;background:var(--soft)}
.opt.right .k,.opt.right .tag{color:var(--ink)}
.opt.wrong{border-style:dashed;color:var(--muted)}
.opt.wrong .txt{text-decoration:line-through}
.opt:disabled{cursor:default}
.why{background:var(--soft);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.why strong{font-size:14px;font-weight:600}
.why p{margin:0}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
.nav .right{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;font-size:14px;border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}

/* Flashcards */
.flash{font:inherit;color:var(--ink);width:100%;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:14px;text-align:center;padding:28px 22px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;
  box-shadow:0 1px 0 var(--line),0 4px 0 -1px var(--surface),0 5px 0 -1px var(--line)}
.flash:hover{border-color:var(--ink)}
.flash:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.flash.back{background:var(--soft)}
.flash .side{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flash .fq{font-weight:500;font-size:clamp(18px,4vw,21px);line-height:1.4;max-width:46ch;text-wrap:pretty}
.flash .fa{font-weight:600;font-size:clamp(18px,4vw,21px);line-height:1.4;max-width:46ch;text-wrap:pretty}
.flash .fa .k{font-family:var(--f-mono);font-weight:500;margin-right:8px}
.flash .fw{color:var(--muted);max-width:52ch;font-size:15px}
.flash .hint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.flash .fq,.flash .fa,.flash .fw{animation:fadeIn .18s ease-out}}
@keyframes fadeIn{from{opacity:.2}to{opacity:1}}

/* Progress */
.progress{padding:16px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:6px}
.stat{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px}
.dot{height:30px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11px;
  display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.dot.cur{border:2px solid var(--ink);color:var(--ink)}
.dot.ok{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.dot.no{border-style:dashed;border-color:var(--ink);color:var(--ink);text-decoration:line-through}
.dot.ans{background:var(--soft);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}
.legend .l-ok{background:var(--ink);border-color:var(--ink)}
.legend .l-no{border:1px dashed var(--ink)}

/* Score */
.score{padding:20px;display:flex;flex-direction:column;gap:16px}
.big{font-family:var(--f-mono);font-size:48px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.pass{font-weight:500}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:84px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.track{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.fill{height:100%;background:var(--ink)}
.bar .v{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:28px 16px}
footer{color:var(--muted);font-size:13px;padding-top:16px;border-top:1px solid var(--line)}
@media (max-width:440px){.setup .row{grid-template-columns:1fr;gap:8px}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.dot,.btn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Florida Sales Associate Review</h1>
    <p class="sub">Chapters 1–5 · practice exams with explanations and flashcards</p>
  </header>

  <section class="section setup" aria-labelledby="h-setup">
    <div class="section-h" id="h-setup"><span>Setup</span></div>
    <div class="panel">
      <div class="row">
        <span class="key">Chapter</span>
        <div class="seg" id="chapters" role="group" aria-label="Chapter"></div>
      </div>
      <div class="row">
        <span class="key">Mode</span>
        <div class="seg" role="group" aria-label="Mode">
          <button class="chip" id="m-practice" data-mode="practice">Practice</button>
          <button class="chip" id="m-exam" data-mode="exam">Exam</button>
          <button class="chip" id="m-flash" data-mode="flash">Flashcards</button>
          <button class="chip" id="m-missed" data-mode="missed">Missed<span class="n" id="missedN">0</span></button>
        </div>
      </div>
      <div class="row">
        <span class="key">Order</span>
        <div class="seg"><button class="chip" id="shuffle" aria-pressed="false">Shuffle</button></div>
      </div>
    </div>
  </section>

  <section class="section" aria-labelledby="h-q">
    <div class="section-h" id="h-q"><span id="qLabel">Question</span><span id="qCount"></span></div>
    <div class="panel" id="main"></div>
  </section>

  <section class="section" aria-labelledby="h-p">
    <div class="section-h" id="h-p"><span>Progress</span></div>
    <div class="panel progress">
      <div class="stats">
        <div class="stat"><b id="sDone">0</b><span>Answered</span></div>
        <div class="stat"><b id="sRight">0</b><span id="sRightL">Correct</span></div>
        <div class="stat"><b id="sPct">–</b><span>Score</span></div>
      </div>
      <div class="rail" id="rail" aria-label="Question navigator"></div>
      <div class="legend"><span><i class="l-ok"></i><span id="lgOk">Correct</span></span><span><i class="l-no"></i><span id="lgNo">Missed</span></span><span><i></i>Not answered</span></div>
    </div>
  </section>

  <footer>Passing score on the state exam is 75%. Your missed list is saved in this browser only.</footer>
</div>

<script>
const CHS = [1,2,3,4,5];
const CH = {1:"The Real Estate Business",2:"License Law & Qualifications",3:"License Law & Commission Rules",4:"Authorized Relationships",5:"Brokerage Activities & Procedures"};
const Q = [
// ---------- Chapter 1 ----------
[1,"Which of the following statements is true regarding a mortgage loan originator?",["A mortgage loan originator is the same as a mortgage lender.","A mortgage loan originator must have a separate license.","A mortgage loan originator makes loans.","A mortgage loan originator must have a real estate license."],1,"Loan originators are licensed separately under F.S. 494. They take applications and negotiate terms; the lender is the one that actually funds the loan."],
[1,"A real estate appraiser's fee for professional service is based on which of the following?",["A percentage of the property's gross income","A percentage of the fair market value of the property","The time and difficulty of the appraisal","A percentage of the property's sales price"],2,"Basing the fee on value or price would give the appraiser a stake in the result. The fee reflects the work involved."],
[1,"Which of the following best describes the real estate brokerage business?",["Service business","Simple business","Business with few opportunities available","Construction business"],0,"Brokers sell a service: bringing buyers and sellers together. They don't produce a product."],
[1,"When a developer completes construction of a new subdivision, all streets, electric, water, and sewer installation are finished and deeded to the city or county. What is this process called?",["A quit claim deed","An easement","Annexation","Dedication"],3,"Dedication is giving private land or improvements to the public for public use."],
[1,"All of the following are responsibilities of a property manager, EXCEPT:",["Renting property for an absentee owner","Collecting rent","Overseeing maintenance","Preparing leases"],3,"Renting, collecting rent and maintenance are core property-management work. Drafting a lease from scratch is legal work for an attorney."],
[1,"What does the term \"farming\" refer to in real estate?",["Specializing in one geographic area","Working in a cooperative manner","Specializing in agricultural properties","Specializing in the sales of orange groves or cattle farms"],0,"Farming means working one neighborhood or area so you become the go-to agent there."],
[1,"Which insurance policies can a real estate licensee offer to the public without additional state licensing?",["Flood insurance","Fire insurance","Renter's insurance","None of the above"],3,"Selling any insurance requires a separate insurance license."],
[1,"What is the purpose of the National Association of REALTORS?",["Preserve the right of individuals to own real property through an exchange of information","Organize antigovernment activities","Promote unethical practice of real estate professionals","Award unearned educational designations"],0,"NAR's mission is protecting the right to own property and sharing information among members."],
[1,"What does the designation of REALTOR signify?",["Anyone in possession of a real estate license is a REALTOR.","The designation identifies the real estate professional as a member of NAR.","The designation is evidence that the licensee has an extensive background in the real estate profession.","The designation is evidence that the licensee has completed extensive real estate studies."],1,"REALTOR is a trademark that means NAR membership. It says nothing about experience or education."],
[1,"A developer contracts to build a home according to the buyer's specifications. This is an example of which type of building?",["Tract","Custom","Speculative","Subdivision"],1,"Built to a specific buyer's specs is custom. Speculative is built before a buyer exists."],
[1,"The federal, state, and local governments all play a role in the regulation of real estate. In which of the following areas would the local government have the most impact?",["Property taxes, building moratoriums, and zoning","Primary and secondary mortgage markets","Documentary stamp taxes, intangible taxes, and note taxes","Civil rights enforcement and monetary policy"],0,"Counties and cities set zoning, building moratoriums and property taxes. Doc stamps are state; mortgage markets and monetary policy are federal."],
[1,"Which of the following best describes licensees who are involved in business opportunity brokerage?",["They must be able to analyze financial statements and understand balance sheets.","They are not required to know much about the business they are selling.","They must have a separate license.","They never become involved in the tax aspects of the business."],0,"Selling a business means valuing it, so you need to read its financials. No separate license is required."],
[1,"Real estate licensees are expected to be knowledgeable in all of the following areas, EXCEPT:",["Marketing","Valuation","Property transfer","Accounting"],3,"Marketing, valuation and property transfer are everyday licensee work. Accounting is a separate profession."],
[1,"Which service provided by real estate licensees requires the most experience and knowledge?",["Property management","Counseling","Appraising","Agricultural sales"],1,"Counseling means giving expert advice across every area of real estate, so it takes the broadest experience."],
[1,"An appraiser, who is registered, licensed, or certified under F.S. 475, Part II, must be utilized in which of the following?",["All appraisals","Comparative market analysis (CMA)","Broker price opinion (BPO)","Valuation in non-federally related transactions"],0,"Only a registered, licensed or certified appraiser may perform an \"appraisal.\" Licensees can still give CMAs and BPOs."],
// ---------- Chapter 2 ----------
[2,"In what year was the Florida Real Estate Commission created?",["1932","1925","1923","1919"],1,"FREC was created in 1925 to administer and enforce the license law. 1923 was the first Florida license law; 1919 was California's, the first in the nation."],
[2,"What is the purpose of the real estate license law?",["To protect the public","To protect licensees","To clarify the law","To grant licenses"],0,"License law exists to protect the public from incompetent or dishonest practitioners."],
[2,"Why was the Florida Real Estate Commission created?",["To protect the public","To administer and enforce the law","To discipline licensees","To award professional designations"],1,"The license law exists to protect the public, but the Commission itself was created in 1925 to administer and enforce that law, so violations no longer had to go through the courts."],
[2,"A sales associate failed to complete the required post-license education prior to renewal. What is the status of the license?",["Revoked","Suspended","Involuntarily inactive","Void"],3,"A sales associate who misses post-license education has a null and void license. They would have to start over."],
[2,"What does the registration of an active sales associate with the Department refer to?",["Placing and keeping on record the sales associate's name and home address","Placing and keeping on record the sales associate's name, home address, and business address of their employing broker","The broker's name and business address","Placing and keeping on record the sales associate's name and the business address of their employer"],1,"Registration records the licensee's name, home address and the employing broker's business address."],
[2,"How may a licensed sales associate be paid by their owner-developer?",["On a salary basis only","On a commission basis only","On a commission basis without a bonus","On a commission or salary basis"],3,"A sales associate registered with an owner-developer can be paid salary or commission."],
[2,"What are the minimum employment requirements for a licensed sales associate to qualify for a real estate broker's license?",["Employed for 6 months under one actively licensed broker","Employed for 12 months under one actively licensed broker","Employed for 24 months under one or more actively licensed brokers","Employed for 6 months under one or more actively licensed brokers"],2,"24 months active as a sales associate under one or more brokers, within the 5 years before applying."],
[2,"How many hours of post-license education are required to renew a broker license?",["14","30","45","60"],3,"Brokers need 60 hours post-license. Sales associates need 45."],
[2,"All of the following services require a real estate license, EXCEPT:",["Leasing","Mortgaging","Buying","Selling"],1,"Mortgage activity is licensed under F.S. 494, not 475."],
[2,"All of the following information appears on a Florida real estate license, EXCEPT:",["The seal of the state of Florida","An expiration date","The signature of the governor","The name of the secretary of Department of Business and Professional Regulation"],2,"The license shows the state seal, an expiration date and the DBPR secretary's name. The governor does not sign it."],
[2,"What must an applicant for a real estate license do if they have been convicted of a crime?",["The applicant must disclose the crime only if it was a felony or resulted in jail time.","The applicant does not need to disclose it on the application unless there was an order of restitution.","The applicant must disclose all arrests and convictions.","The applicant must disclose all convictions on the application."],3,"Every conviction must be disclosed, including pleas of guilty or no contest and sealed records. Arrests alone are not required."],
[2,"Which condition must exist for an applicant to qualify for a Florida real estate license?",["The applicant must be a citizen of the United States.","The applicant must be a Florida resident.","The applicant must be at least 21 years of age.","The applicant must have a high school education or equivalent."],3,"Requirements are age 18, a high school diploma or equivalent, and honesty and good character. Citizenship and residency are not required."],
[2,"Which of the following statements best describes an attorney-in-fact?",["An attorney-in-fact must be a member of the Florida Bar.","An attorney-in-fact may be paid a commission for services of real estate.","An attorney-in-fact is authorized by a power of attorney to act for another.","An attorney-in-fact is required to hold an active real estate license."],2,"An attorney-in-fact is anyone holding a power of attorney. They don't need to be a lawyer and can't take a commission."],
[2,"Which individual is exempt from the licensing requirements of Florida Statute 475?",["A partner in a real estate partnership who receives compensation in excess of their interest in the partnership for performance of real estate services on behalf of the partnership","A condominium manager who is paid on a commission basis for rentals of less than one year","An appraiser who is certified under Florida Statute 475, Part II, when performing brokerage services","An attorney who performs legal duties in connection with a real estate transaction"],3,"Attorneys doing legal work are exempt. The partner is paid beyond their share, the condo manager is paid commission, and the appraiser is doing brokerage, so none of them are exempt."],
[2,"Complete this statement. An actively licensed attorney who is a member in good standing with the Florida Bar ______.",["May charge commissions in connection with real estate activities","Is exempt from continuing education requirements to maintain a real estate license","Is not allowed to simultaneously hold a real estate license","May be licensed as a broker but not as a sales associate"],1,"Florida Bar members who hold a real estate license are exempt from the continuing education requirement."],
[2,"What is a broker associate?",["A broker who employs sales associates","A sales associate","A broker who is employed as a sales associate","A sales associate who is employed as a broker"],2,"A broker associate holds a broker license but works under another broker, the way a sales associate does."],
[2,"Florida has an agreement with some other states that recognizes the similarity in education and experience requirements for licensees. What is the agreement called?",["Reciprocity","Mutual recognition","Cooperative licensure","Intrastate licensing"],1,"Florida uses mutual recognition agreements. Applicants from those states take a 40-question Florida law exam."],
[2,"Which of the following statements is true regarding a plumber who has been appointed by a court to appraise a small business?",["The plumber is in violation of F.S. 475.","The plumber may charge a commission.","The plumber may do so and be paid a fee.","The plumber must first be licensed under F.S. 475, Part II."],2,"Anyone appointed by a court is exempt and may be paid a fee."],
[2,"All of the following individuals are exempt from the real estate license law, EXCEPT:",["Employees of a corporation who are paid on a salary basis","Partners in a partnership who receive a pro rata share of the profits","Condominium managers who rent units within the complex for periods up to one year","Funeral directors performing duties of real estate for compensation"],3,"Funeral directors have no exemption. Doing real estate work for pay requires a license."],
[2,"A Georgia broker with extensive experience in conducting auctions was asked by a local real estate broker to auction a small motel in Jacksonville. The auction did not result in a sale. The Florida broker paid the Georgia broker for out-of-pocket expenses, but did not pay a commission. Which of the following statements is correct?",["The Georgia broker violated license law.","The Florida broker did not violate license law.","The Florida broker is not subject to discipline by the Commission.","The transaction is perfectly within the license law."],0,"Auctioning Florida real estate in expectation of compensation requires a Florida license. Not getting paid does not cure it, and the Florida broker also violated the law by using an unlicensed person."],
// ---------- Chapter 3 ----------
[3,"The Department of Business and Professional Regulation has the authority to issue all of the following, EXCEPT:",["A cease-and-desist order","A subpoena","An injunction","A notice of noncompliance"],2,"Only a court issues an injunction. DBPR can go to court to ask for one."],
[3,"What is the maximum number of years a member may serve on the Florida Real Estate Commission?",["4","8","12","No maximum"],3,"Members serve 4-year terms and may not serve more than two consecutive terms, but there is no maximum number of years overall."],
[3,"Which statement is true regarding the secretary of the Department of Business and Professional Regulation?",["The secretary is a member of the Florida Real Estate Commission.","The secretary is appointed by the governor.","The secretary must be an attorney.","The secretary answers to the state legislature in the performance of duties."],1,"The governor appoints the DBPR secretary, with Senate confirmation."],
[3,"The Division of Real Estate is an administrative part of which of the following?",["The state of Florida","The Department of Commerce","The Department of Banking","The Department of Business and Professional Regulation"],3,"The Division of Real Estate sits inside DBPR."],
[3,"Which statement is true regarding examination questions and answers?",["They are published in the Administrative Weekly before appearing in an examination.","They may not be challenged.","They may be reviewed by any member of the public upon request.","They are confidential."],3,"Exam questions and answers are confidential. Applicants can still challenge a question through the proper process."],
[3,"Which of the following entities issues real estate licenses?",["The state of Florida","The Department of Business and Professional Regulation","The Department of Revenue","The Florida Real Estate Commission"],1,"FREC decides who qualifies. DBPR actually issues the license."],
[3,"After being active in the real estate business for over five years, a licensee's license expired on September 30th. What is the status of the license on October 1st?",["Suspended","Revoked","Involuntary inactive","Voluntary inactive"],2,"A license that isn't renewed goes involuntary inactive. After 2 years in that status it becomes null and void."],
[3,"The Florida Real Estate Commission held a meeting for the purpose of passing a new rule. This is an exercise of which Commission power?",["Executive","Quasi-legislative","Quasi-judicial","Ministerial"],1,"Making rules is quasi-legislative. Deciding discipline cases is quasi-judicial."],
[3,"Which of the following statements is true regarding the director of the Division of Real Estate?",["The director is appointed by the secretary of the Department of Business and Professional Regulation.","The director is a member of the Florida Real Estate Commission.","The director is not subject to confirmation or approval by the Florida Real Estate Commission.","The director answers only to the governor in the performance of their duties."],0,"The DBPR secretary appoints the director, subject to FREC approval."],
[3,"The Department of Business and Professional Regulation is created by which statute?",["F.S. 120","F.S. 455","F.S. 475","F.S. 494"],1,"F.S. 455 covers DBPR. 475 is real estate, 120 is administrative procedure, 494 is mortgage."],
[3,"If an applicant for a real estate license provides false information, they commit which of the following criminal violations?",["First-degree misdemeanor","Second-degree misdemeanor","Second-degree felony","Third-degree felony"],3,"Giving false information to get a license is a third-degree felony."],
[3,"What action may the Department take if it determines that an unlicensed person has operated in violation of a law or rule under its administration?",["None, since the Department has no jurisdiction over unlicensed individuals.","It may issue an injunction prohibiting such activity in the future.","It may imprison the violator for up to five years.","An administrative fine of up to $5,000 may be imposed."],3,"DBPR can fine unlicensed activity up to $5,000 per offense. It cannot imprison anyone or issue an injunction itself."],
[3,"Educational requirements of applicants for a real estate license are promulgated under what authority of the Florida Real Estate Commission?",["Ministerial","Executive","Quasi-legislative","Quasi-judicial"],2,"Setting education requirements is rulemaking, which is quasi-legislative."],
[3,"When is a request for the renewal of a license effective?",["When received by the Department","The day following expiration","On the date the application is mailed","On the date indicated on the license"],0,"A renewal request takes effect when DBPR receives it."],
[3,"When does a real estate license expire?",["On the date shown on the license","Every two years","On the effective date","At the end of one year"],0,"A license expires on the date printed on it, either March 31 or September 30."],
[3,"New Commission rules must be approved by which of the following?",["The Department of Business and Professional Regulation","The secretary of state","The governor","No one"],3,"FREC adopts its own rules without anyone else signing off."],
[3,"How long may a license remain in voluntary inactive status?",["Two years","Four years","Ten years","Indefinitely"],3,"A voluntarily inactive license can stay that way as long as it keeps getting renewed."],
[3,"Which of the following best describes certificates that are entered into court as evidence?",["Of no value","Disqualified","Prima facie evidence","Proof of a fact"],2,"DBPR certificates count as prima facie evidence: accepted as true unless someone disproves them."],
[3,"Violations of the Commission rules are prosecuted by which agency?",["Florida BAR Association","Department of Business and Professional Regulation","Florida State Attorney General","Sheriff of the county in which the violation occurred"],1,"DBPR investigates and prosecutes rule violations. FREC hears the case and decides."],
[3,"A sales associate is employed by a broker Monday through Friday and for a builder on the weekends. The sales associate feels the added experience is beneficial especially since both employers pay an attractive commission split. Which statement is correct?",["The sales associate must obtain a group license.","Multiple licenses are required in this situation.","This arrangement violates the license law.","This is permissible if both employers agree to the arrangement."],2,"A sales associate can be registered with only one employer at a time."],
// ---------- Chapter 4 ----------
[4,"Who owes fiduciary duties in a single agency relationship?",["The broker only","The principal only","Both parties","Neither party"],0,"The agent (broker) owes fiduciary duties to the principal. It doesn't run the other way."],
[4,"All of the following activities are exempt from the requirement to provide disclosures under the Brokerage Relationship Disclosure Act, EXCEPT:",["Sales staff at a new development center","Showing property to a party that is not being represented","A bona fide open house or model home showing that does not involve eliciting confidential information, the execution of a contractual offer or an agreement for representation, or negotiations concerning price terms, or conditions of a potential sale","Responding to general factual questions from a potential buyer or seller concerning properties that have been advertised for sale"],1,"Showing property to an unrepresented buyer is real brokerage work, so the disclosure is required."],
[4,"As an agent, a broker is employed by and acts on behalf of whom?",["A buyer","A seller","A customer","A principal"],3,"The principal is the person who hires the agent. That can be a buyer or a seller; a customer is the other party."],
[4,"In which of the following situations does a general agency relationship exist?",["When a broker is employed to market a property","When a sales associate is working with a customer","When a sales associate is employed by a broker","When a broker is employed by a buyer"],2,"A sales associate can do many tasks for their broker, which makes it general agency. Marketing one property is special agency."],
[4,"Broker Joan just received an oral offer to purchase a listed property. No earnest money accompanied the oral offer. Which of the following statements is correct?",["Joan must present the offer.","Joan should not present the offer since no earnest money deposit was received.","Joan must advise the customer that an earnest money deposit is required to make an offer valid.","Joan should reject the offer on behalf of the seller."],0,"Every offer must be presented to the seller, oral or written, with or without a deposit."],
[4,"Which of the following statements best describes a transaction broker?",["A transaction broker is an agent of both parties.","A transaction broker has fiduciary duties to the seller.","A transaction broker has fiduciary duties to the buyer.","A transaction broker may provide limited representation to both parties."],3,"A transaction broker gives limited representation to one or both parties and is not a fiduciary."],
[4,"An agent failed to advise a principal regarding the value of the owner's property prior to accepting a listing. Which fiduciary duty did the agent breach?",["Loyalty","Disclosure","Accounting","Obedience"],1,"The agent must disclose everything that affects the principal's interests, including the property's value."],
[4,"What is an agent required to do in an agency relationship?",["Obtain the highest price possible.","Attempt to obtain the most favorable price and terms on behalf of the principal.","Obtain the lowest price possible.","Negotiate the transaction to receive the highest possible commission."],1,"The duty is to try for the best price and terms for the principal. No agent can guarantee a result."],
[4,"When can an agent disclose confidential or harmful information about a principal?",["At any time","During the fiduciary relationship period only","After the transaction is completed and the fiduciary relationship is over","Never"],3,"Confidentiality continues after the relationship ends, unless the principal permits it or the law requires it."],
[4,"Each of the following is contained in the definition of a residential transaction, EXCEPT:",["Unimproved property intended for four units or fewer","Agricultural properties of ten acres or less","Leases with options to purchase all or a portion of improved property of four or fewer residential units","Dispositions of business interests involving property of five or more residential units"],3,"Residential means 1–4 units, vacant land for 1–4 units, or agricultural land of 10 acres or less. Five or more units is not residential."],
[4,"All of the following provide control of agency relationships, EXCEPT:",["F.S. 475","Common law","The Brokerage Relationship Disclosure Act","The Department of Financial Services"],3,"Agency is governed by F.S. 475, the Disclosure Act and common law. Financial Services has no role."],
[4,"Which of the following statements best describes policy and procedures manuals?",["Policy and procedures manuals are maintained by all real estate offices.","Policy and procedures manuals are required by law.","Policy and procedures manuals are a major cause of arguments.","Policy and procedures manuals are useful in maintaining good relations within a brokerage office."],3,"They aren't required, but they set expectations and prevent disputes inside the office."],
[4,"A broker has appointed two sales associates to act as agents in a nonresidential transaction, one for the seller and one for the buyer. Which statement is correct?",["This is an illegal dual agency.","The sales associates are referred to as designated sales associates.","Buyer and seller must have combined assets of $1 million.","The FREC will revoke the licenses of the broker and both sales associates."],1,"In nonresidential deals a broker can designate one associate for each side. Each party must have assets of $1 million or more (each, not combined)."],
[4,"Each of the following relationships is adversarial, EXCEPT:",["Arm's length","Buyer beware","Caveat emptor","Fiduciary"],3,"A fiduciary relationship is one of trust. The other three describe parties on opposite sides."],
[4,"In which circumstance are licensees expected to act with fairness and honesty?",["Single agency only","Transaction brokerage only","Nonrepresentation only","Any real estate transaction"],3,"Honesty and fair dealing are owed in every relationship, including no brokerage relationship."],
[4,"According to the Brokerage Relationship Disclosure Act, which is the only brokerage relationship form that must be signed or initialed?",["Single Agency Disclosure","Transaction Broker Disclosure","Consent to Transition to Transaction Broker","Important Information Disclosure"],2,"The principal must sign or initial the Consent to Transition before the broker changes from single agent to transaction broker."],
[4,"Which of the following statements is correct regarding a broker's authority to act on behalf of the principal?",["A broker can refuse offers on behalf of the principal.","A broker can buy the listed property without consent of the principal.","A broker must follow all legal instructions of the principal or withdraw.","A broker must ignore the instructions of a principal when the instructions are not in the best interests of the principal."],2,"Obedience means following all lawful instructions. If the broker can't, they withdraw."]

  1: [
    ["Real estate brokerage", "A business in which a broker acts as an agent or intermediary between two or more people in the sale, purchase or rental of real estate, for compensation.", "Main activities: marketing, property transfer, market conditions and valuation."],
    ["Absentee owner", "Someone who buys income property as an investment and depends on professionals to manage it.", "These professionals are property managers."],
    ["Property management", "Managing income property for owners while maximizing the profitability of the investment.", "Absentee ownership is a big reason property management keeps growing."],
    ["Property manager", "Locates tenants, collects rent, and handles payment of taxes, insurance and other expenses.", "Paid a percentage of the rents collected. Does NOT write leases, but may assist with attorney-prepared leases."],
    ["Community association manager (CAM)", "A property manager working for a community association needs a CAM license when the association has more than 10 units or an annual budget over $100,000.", "F.S. 468.431(2)"],
    ["Business broker", "A real estate broker who specializes in the listing and sale of businesses.", "Must be able to analyze financial statements and understand balance sheets. No separate license needed."],
    ["Business opportunity", "The sale of a business, which includes going concern value in addition to the real property.", ""],
    ["Going concern value", "The value of a business as an operating company: its income, tangible and intangible assets, goodwill and property value.", ""],
    ["Appraisal", "Developing an independent, impartial and objective analysis or opinion of the value of real property.", "Appraisal fees are based on the time, effort and expense involved, never on the property's value."],
    ["Appraiser", "A person who develops appraisals. Must be registered, licensed or certified under F.S. 475, Part II.", "Appraisers must follow USPAP."],
    ["Comparative market analysis (CMA)", "A value estimate a licensee prepares from recent sales of similar properties in the same neighborhood.", "It uses many appraisal concepts but may NOT be called an appraisal."],
    ["Broker price opinion (BPO)", "A licensee's estimate of a property's likely selling price, often ordered by a lender in a short sale.", "Real estate licensees may be asked to complete a BPO. Less thorough than an appraisal, but more analysis than a basic CMA."],
    ["FIRREA", "Financial Institutions Reform, Recovery, and Enforcement Act of 1989.", "Title XI requires appraisals in federally related transactions to be done by state licensed or certified appraisers."],
    ["USPAP", "Uniform Standards of Professional Appraisal Practice, developed by the Appraisal Foundation.", "All appraisals, federally related or not, must be prepared in compliance with USPAP."],
    ["Federally related transaction", "A transaction in which a federally regulated lending institution makes a loan secured by real property.", "Requires an appraisal by a licensed or certified appraiser."],
    ["Counseling", "Analyzing existing or potential projects and giving expert advice, usually for a flat fee.", "Requires the highest level of knowledge and experience of any real estate service."],
    ["Farm area (target market)", "Concentrating on one neighborhood, or on one type or style of property.", "Called farming. Considered one of the best ways to succeed in real estate."],
    ["Multiple listing service (MLS)", "A marketing tool that puts your listings in front of thousands of other licensees, with a detailed database of properties for sale or lease.", "Access usually comes with local REALTOR association membership."],
    ["Follow-up", "Staying in touch with past customers to earn referrals and repeat business.", "Contact them at least twice a year: the anniversary of their purchase, flyers, notes or postcards with your name, photo and contact info."],
    ["Residential transaction", "Sale of improved residential property of 4 units or fewer, unimproved land intended for 4 units or fewer, or agricultural property of 10 acres or less.", "Also leases with an option to buy 4 or fewer units, and business interests in property of 4 or fewer units. F.S. 475.278(5)(a). Most licensees work in residential."],
    ["Agricultural sales", "Sales of farm and ranch property.", "Two common characteristics: large amounts of land and large sums of money."],
    ["Mortgage loan originator (MLO)", "An individual or business that arranges loans between lenders and borrowers. They do NOT make loans.", "Must have a separate license issued by the Florida Department of Financial Services (FDFS)."],
    ["Where can mortgage loans be obtained?", "Mortgage companies, commercial banks, savings and loans, credit unions, life insurance companies, trusts and individuals.", "Marked as a test question in your notes."],

    ["Three phases of development and construction", "1. Land acquisition\n2. Subdividing and development\n3. Construction", "The subdivision plat map gets recorded during subdividing."],
    ["Subdivision plat map", "Map of a subdivision showing named streets and numbered blocks and lots, recorded once approved by the city or county.", "Building permits cannot be issued until the plat is part of the public record."],
    ["Dedication", "Ownership of the streets and sidewalks is conveyed from the developer to the city or county.", ""],
    ["Custom building", "Built to the customer's specifications.", "Know the definitions and examples of all three building types for the test."],

    ["National Association of REALTORS (NAR)", "The nation's largest trade and professional association. Goal: preserving the right of individuals to own real property through an exchange of information.", "Members agree to follow a strict Code of Ethics."],
