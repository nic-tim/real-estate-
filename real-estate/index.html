  2: [
    ["Purpose of the license law (F.S. 475)", "To protect the public.", "F.S. 475 is the Florida Real Estate License Law. Your note: 475 = protect the public."],
    ["Caveat emptor", "\"Let the buyer beware.\" Before license laws, there was no warranty that a property was fit for ordinary use.", "The exception was fraud: if the seller actively concealed defects or made material misrepresentations."],
    ["1919", "California enacted the first real estate license law.", "Your note: important. 1919 is the first real estate license law."],
    ["1923", "Florida enacted its first real estate license law.", "It didn't work well: violations had to be pursued in the courts, which was slow and expensive."],
    ["1925", "The Florida Real Estate Commission (FREC) was created to administer and enforce the law.", "This removed the need for court enforcement."],
    ["1941", "The Real Estate License Law was officially designated Chapter 475 of the Florida Statutes.", ""],
    ["1979 and 1982", "1979: the Commission was renamed the Board of Real Estate and placed under the new Department of Professional Regulation (DPR).\n1982: a Division of Real Estate was created and the name Florida Real Estate Commission was restored.", ""],
    ["1991", "F.S. 475 was split into Part I (real estate licensees) and Part II (appraisers).", "Part II created the Florida Real Estate Appraisal Board (FREAB) for appraisers in federally related transactions."],
    ["1993", "The Department of Professional Regulation and the Department of Business Regulation were combined into the Department of Business and Professional Regulation (DBPR).", "New disclosure requirements were also added to F.S. 475 that year."],
    ["FREC", "Florida Real Estate Commission. Called \"the Commission.\"", ""],
    ["DBPR", "Department of Business and Professional Regulation. Called \"the Department.\"", "The Division of Real Estate (DRE) sits inside DBPR."],
    ["License / Licensee", "License: any permit, registration, certificate or license issued by the Department.\nLicensee: any person who has been issued one.", ""],
    ["When is a real estate license required?", "When ALL four are present:\n1. Performing a service of real estate\n2. In the state of Florida\n3. For another\n4. For compensation", "Unless the person is exempt under the law."],
    ["Compensation", "Anything of value paid, received, expected to be paid, or expected to be received in exchange for a service.", "Even an expected payment counts."],
    ["\"A BAR SALE\"", "The most common services of real estate:\nAppraising\nBuying, Auctioning, Renting\nSelling, Advertising, Leasing, Exchanging", "Others: business brokerage, listing, property management, syndicating, timeshares, counseling."],
    ["Auctioning real estate", "Real estate licensees may auction real estate without a separate auctioneer's license.", "Using by-bidders to drive up the price (with no intent to buy) is illegal."],
    ["Exemptions", "F.S. 475.011 lists persons and entities that may perform real estate services for compensation without a license.", "Examples: attorneys doing legal work, court-appointed people, salaried employees, condo managers for rentals under one year."],
    ["Sales associate", "Someone new to real estate who completes the pre-license requirements and must be employed by a real estate broker or owner-developer.", "Sales associates are NEVER paid directly by a customer. They are paid only by their employing broker."],
    ["Broker", "A person who performs real estate services for another and receives compensation for them.", "May open an office and hire sales associates and broker associates."],
    ["Broker associate", "Someone who holds a broker license but chooses to work under another broker, in a sales associate capacity.", ""],
    ["Education requirements: sales associate vs broker", "Sales associate: pre-license, then post-license, then biennial continuing education.\nBroker: their own broker pre-license and post-license, then biennial CE.", "Biennial = every two years."],
    ["Experience to apply for a broker license", "Active sales associate for at least 24 months, under one or more brokers, within the 5 years before applying.", "Working for an owner-developer does NOT count."],
    ["Other ways to qualify for a broker license", "Licensed for 24 months in another state or nation within the last 5 years; salaried government employees doing real estate work for 24 months within 5 years; DBPR investigators with 24 months of experience.", "F.A.C. 61J2-2.027(1)(b)"],
    ["General qualifications for licensure", "Social Security number, at least 18 years old, high school diploma or equivalent, honest, truthful, trustworthy and of good character.", "F.S. 475.17(1)"],
    ["Must you be a Florida resident or U.S. citizen?", "No. Neither is required for a Florida real estate license.", "F.S. 455.10"],
    ["Three licensing phases", "1. Pre-licensing\n2. Post-licensing\n3. Continuing education", ""],
    ["Pre-licensing steps", "1. Pass the course final exam with 70% or higher\n2. Submit the application and fee\n3. Submit electronic fingerprints\n4. Pass the state exam with 75% or higher (inactive license)\n5. File employment (active license)", ""],
    ["Mutual recognition", "Agreements between Florida and a few states that recognize similar education and experience requirements.", "Applicants skip pre-licensing and take a 40-question Florida law exam (75%, or 30 correct). This is NOT reciprocity. Florida has no reciprocity."],
    ["Mutual recognition states", "Alabama, Arkansas, Connecticut, Georgia, Illinois, Kentucky, Mississippi, Nebraska, Rhode Island and West Virginia.", "Check the DBPR website for the current list."],
    ["Nonresident licensees", "Must take all post-license and continuing education, the same as Florida licensees.", ""],
    ["Florida resident (for mutual recognition)", "Anyone who has lived in Florida 4 months or more in the past year, or currently lives here intending to stay 4 months or more.", "An RV, hotel or rental unit counts as a residence."],
    ["Initial license application", "Form DBPR RE 1, submitted online with the fee.", "The same form is used for Florida residents, nonresidents and mutual recognition applicants."],
    ["Electronic fingerprints", "Required for all applicants. Sent to the Florida Department of Law Enforcement (FDLE) and the FBI.", "Kept for 12 months. If they expire before you apply, you must submit new ones."],
    ["Background question 1", "Have you ever been convicted or found guilty of, or pled guilty or nolo contendere to, a crime, regardless of adjudication?", "Disclose ALL convictions, felony or misdemeanor. Only minor traffic offenses are left out. DUI is not a minor traffic offense."],
    ["Nolo contendere", "A plea of no contest.", "It must be disclosed on the application."],
    ["Adjudication withheld", "A sentence such as probation, community service or a fine is imposed, but there is no formal conviction.", "It must still be disclosed."],
    ["Expunge", "To have criminal records removed by a court. The defendant must petition the court; it isn't automatic.", "Saying \"I thought it was expunged\" is not a valid excuse for leaving an offense off the application."],
    ["Affirmation by written declaration", "The applicant affirms, under penalty of perjury, that every fact on the application is true.", "False information can lead to criminal penalties, fines, suspension or revocation."],
    ["Application review timeline", "DBPR has 30 days to review an application for errors or omissions, and must approve or deny it within 90 days of a complete application.", "F.S. 120.60. Your note: 30 days to review, 90 days to approve or deny."],
    ["Application denied for a minor error", "It is denied \"without prejudice\" and returned for correction.", "Falsifying the application can make the candidate ineligible for a license."],
    ["Owner-developer", "A person or company that owns property and employs sales associates to sell or rent its own property.", "May pay its sales associates salary or commission. It doesn't count toward broker experience."],
    ["Application approval", "Once approved, the applicant must pass the state exam within 2 years.", "Otherwise they must file a new application. F.S. 475.181(2)"],
    ["Application denial", "The applicant is notified in writing with the reasons, and has 21 days to request a formal hearing before an administrative law judge.", "Under F.S. 120, the Administrative Procedure Act."],
    ["Fee waiver for military veterans and spouses", "DBPR waives the initial licensing fee, application fee and unlicensed activity fee.", "Apply within 60 months after an honorable discharge. F.S. 455.213(13)"],
    ["Active-duty service members and spouses", "DBPR issues a professional license to active-duty members, or their spouses, who hold the same license in another state or U.S. territory.", "The initial application fee is waived, but exam fees are not."],
    ["Sales associate pre-license course (FREC I)", "63 hours including the final exam: real estate principles, practices, basic real estate law and license law.", "Pass the timed 100-question final with 70% or higher. The course completion certificate is good for 2 years."],
    ["Who is exempt from the pre-license course?", "Anyone with a four-year degree in real estate from an accredited college or university.", "Your note: a 4-year degree in real estate will exempt you."],
    ["Florida attorneys and education", "Exempt from the 63-hour pre-license course and from continuing education. NOT exempt from post-license.", "They still have to take the state exam, with a copy of their Florida Bar card."],
    ["Pre-license classroom attendance", "Missing more than 8 classroom hours disqualifies the student from the final exam.", "Missed hours must be made up, and the final taken, within 30 days of the original exam date."],
    ["Failing the course final exam", "The student may take an alternate final after waiting at least 30 days, within one year of the original exam.", "Failing the alternate means retaking the whole course."],
    ["Broker pre-license course (FREC II)", "72 hours including the final exam.", "Pass with 70% or higher."],
    ["State license exam", "100 multiple-choice questions: 45 on license law, 45 on principles and practices, 10 on math.", "Pass with 75% (75 correct). Results are pass/fail only and the questions are confidential."],
    ["After passing the state exam", "The applicant gets an inactive license.", "To be active, a sales associate must be employed by a broker or owner-developer and register that employment with DBPR."],
    ["Failing the state exam", "The applicant gets a score breakdown by category and can schedule a review of the missed questions.", "Any challenge must be written during the scheduled review."],
    ["Exam in a foreign language", "Given in the applicant's native language only if 15 or more applicants request it.", "The full cost is paid by those applicants. F.S. 455.11"],
    ["Who can a sales associate work for?", "Only ONE broker or owner-developer at a time, and only that employer may pay them.", "Your note: a sales associate may only be employed under one broker."],
    ["Owner-developer and unlicensed salespeople", "An owner-developer can use unlicensed salespeople to sell its own property if they're paid a salary.", "If it pays commissions or transaction fees, it must hire licensees."],
    ["Change of status form", "Form DBPR RE 11. A newly licensed sales associate can't practice until it's filed to activate the license.", "The testing service's letter acts as a temporary license until the real one arrives."],
    ["Registration vs licensure", "Licensure: the granting of a license to practice.\nRegistration: keeping on record the name and address of an individual or business.", "Individuals are licensed AND registered. Businesses are registered only. DRE keeps the registration list."],
    ["What's on a Florida real estate license?", "Licensee's name and address, license type, effective date, expiration date, the state seal, the governor's name and the DBPR secretary's name.", "No signatures! Possession of a license is prima facie evidence that the holder is licensed."],
    ["Sales associate first renewal", "Complete the 45-hour post-license course before the initial license expires.", "Miss it and the license is VOID. To come back: take the 63-hour course and pass the state exam again."],
    ["Broker first renewal", "Complete 60 hours of post-license education before the initial license expires.", "Miss it and the license is void. They can revert to an active sales associate by taking a 14-hour CE course within 6 months."],
    ["Post-license requirements", "Sales associate: 45 hours, pass with 75% or higher.\nBroker: 60 hours, pass with 75% or higher.", "No state exam. The course provider reports completion to DBPR."],
    ["Pre-license vs post-license scores", "Sales associate: 63 hours at 70%, then 45 hours at 75%.\nBroker: 72 hours at 70%, then 60 hours at 75%.", ""],
    ["Post-license classroom attendance", "Missing more than 10% of the instruction means you can't take the final exam.", "Make up the hours and take the final within 30 days."],
    ["Continuing education (CE) hours", "14 hours every 2-year renewal after the first renewal, for brokers and sales associates, active or inactive.", "Miss it and the license goes involuntary inactive. Distance courses need 80% or higher on a 30-question exam. Ignorance of the requirements is no excuse."],
    ["Keeping course certificates", "Keep pre-license, post-license and CE certificates for at least 2 years.", "DBPR can audit. A licensee whose courses weren't reported can't renew."],
    ["Attorneys-at-law (exemption)", "May perform legal services for clients: prepare documents, handle closings, give legal advice.", "They may NOT receive sales commissions or referral fees without a real estate license."],
    ["Attorneys-in-fact (exemption)", "People given authority under a power of attorney to act for someone else, such as signing documents.", ""],
    ["Certified public accountants (exemption)", "May do accounting work for clients, prepare documents and handle closings.", "May NOT receive sales commissions or referral fees without a license."],
    ["Court appointees (exemption)", "Trustees, receivers, masters in chancery and court-appointed appraisers.", "May be paid a fee or salary, but not a commission."],
    ["Salaried employees of certain entities (exemption)", "Employees of government agencies, railroads, rural electric cooperatives and public utilities doing real estate work for their employer.", ""],
    ["Salaried apartment employees (exemption)", "Employees working in an apartment community's onsite rental office.", "A tenant can receive up to $50 for referring a new tenant to the same complex."],
    ["Individuals (exemption)", "May buy, sell or perform real estate services for themselves without a license.", ""],
    ["Partners in a partnership (exemption)", "Exempt when each partner gets a pro rata share of profits based on their ownership.", "If any partner gets more than their ownership share, ALL the partners violate the license law."],
    ["Corporations (exemption)", "Corporations that sell, exchange or lease their own real property.", ""],
    ["Salaried employees of owners (exemption)", "Salaried employees may perform real estate services for their employer.", "Any bonus, commission or transaction pay beyond salary requires a license."],
    ["Personal property dealers (exemption)", "People who deal only in personal property transactions.", "Mortgages are personal property, but dealing in them needs a mortgage loan originator license."],
    ["Other exemptions", "Cemetery lot salespersons; renting a mobile home lot or recreational lot in a mobile home park or travel park.", ""],
    ["Salaried condo/co-op managers (exemption)", "Exempt when renting units within their complex for periods of no more than one year.", ""],
    ["Radio, TV and cable employees (exemption)", "May handle real estate tied to the FCC license.", "If the transaction includes physical land or buildings, a broker is needed for that part."],
    ["Graduate appraising students (exemption)", "Full-time graduate students in an approved appraising degree program, under a licensed or certified appraiser.", "Reports are issued in the supervising appraiser's name."],
    ["Timeshares (exemption)", "Owners reselling timeshare periods they bought for their own use, and timeshare exchange companies following F.S. 721.18.", ""],
    ["Appraisers (exemption)", "Appraisers certified or licensed under F.S. 475, Part II, doing authorized appraisal work, and unit-rule railroad appraisers for tax purposes.", ""],
    ["Transient rentals and securities dealers (exemption)", "Anyone renting hotel, motel or rooming-house space; SEC-registered dealers selling a business enterprise to an accredited investor.", "The securities exemption doesn't cover the land and buildings in the deal."],
    ["Prima facie evidence", "Evidence that's accepted as true unless someone proves otherwise.", "Possessing a current real estate license is prima facie evidence in court that the holder is licensed."]
  ],
  3: [
    ["DBPR", "Department of Business and Professional Regulation. Created by F.S. 455 to license, oversee and regulate businesses and professions in Florida.", "Part of the governor's executive branch, governed by F.S. 120, structured under F.S. 20.165. Your note: know statutes 475 and 455."],
    ["Secretary of DBPR", "The head of the Department. Appointed by the governor and confirmed by the senate.", "No term limit: serves at the pleasure of the governor. Main offices are in Tallahassee."],
    ["When should a profession be regulated? (F.S. 455)", "Only when unregulated practice can harm the public's health, safety or welfare; the harm clearly outweighs any anticompetitive effect; the public isn't protected by other laws; and less restrictive regulation isn't available.", "The intent of F.S. 455: regulate in the most cost-efficient way, keep license costs down and maximize public access."],
    ["Division of Real Estate (DRE)", "The DBPR division that protects the public by regulating real estate and appraisal licensees through education and compliance.", "Offices are in Orlando and can't move without the legislature's permission."],
    ["Director of the Division of Real Estate", "Appointed by the DBPR secretary, subject to approval by a majority of FREC.", "A salaried state employee who runs the Division day to day."],
    ["F.S. 475: the four parts", "Part I: brokers, sales associates and schools (FREC, rules in 61J2)\nPart II: appraisers (FREAB, rules in 61J1)\nPart III: Commercial Real Estate Sales Commission Lien Act\nPart IV: Commercial Real Estate Leasing Commission Lien Act", "Parts III and IV let a broker place a lien for an earned commission on commercial property."],
    ["How DBPR, DRE and FREC fit together", "DBPR delegates real estate rule-making and discipline to FREC. FREC has only 7 members and no employees, so the Division does the day-to-day work.", "Your note: DBPR → DRE → FREC (7 members)."],
    ["DBPR duties", "1. Investigate applicants, licensees and unlicensed persons\n2. Prosecute violations of laws or rules\n3. Issue, renew and reissue licenses", ""],
    ["Injunctions", "DBPR can SEEK an injunction from a court. It can't issue one itself.", "Used against a licensee who ignores a Department order, or against unlicensed activity."],
    ["DBPR enforcement powers", "Cease-and-desist orders, subpoenas, oaths, depositions, and notices of noncompliance or citations.", "Citation fines can't exceed $5,000. Unlicensed activity can be fined up to $5,000 per offense."],
    ["Mediation", "For economic offenses that licensees can fix. The parties have 14 days after a mediator contacts them to agree to mediate.", "It must be resolved within 60 days."],
    ["Unlicensed activity enforcement", "A $5 fee from every applicant and renewal pays for it.", "As plaintiff in a civil action, DBPR can seek a penalty of $500 to $5,000 per offense."],
    ["Giving false information to get a license", "A felony of the third degree.", "F.S. 455.2275"],
    ["License renewal cycle", "Licenses are issued and renewed on a 2-year (biennial) cycle.", "A license can be denied or suspended for failing to pay court-ordered child support."],
    ["Real estate school permits", "Every school, and each school location, needs a DBPR permit. Every instructor needs a permit to teach.", "Permits last 2 years and expire September 30 of odd-numbered years."],
    ["Testing new applicants", "DBPR's Division of Professions handles testing through a private testing service.", "Exam questions are confidential. Stealing or copying them is a third-degree felony."],
    ["FREC", "Florida Real Estate Commission: an administrative agency with powers delegated under F.S. 475 and F.A.C. 61J2.", ""],
    ["Executive powers", "Keeping licensees and the public informed through publications (promulgation), plus investigating complaints.", "Can be used by the chairperson alone or delegated to any member by quorum vote."],
    ["Quasi-legislative powers", "Making and passing rules. FREC rules are in F.A.C. Chapter 61J2.", "Cannot be delegated. Rules need no outside approval and take effect 20 days after filing with the Secretary of State."],
    ["Quasi-judicial powers", "Disciplining: deny an application, reprimand, fine, place on probation, suspend or revoke.", "Cannot be delegated; requires a quorum vote."],
    ["Ministerial powers", "Record keeping and clerical work.", "Done by Division employees, since FREC has no staff."],
    ["FREC's four powers (memory card)", "Executive: keep licensees and the public informed.\nQuasi-legislative: make and pass rules.\nQuasi-judicial: impose discipline.\nMinisterial: record keeping.", "From your sticky note."],
    ["FREC discipline options", "Deny an application, reprimand, fine up to $5,000 per offense, probation, suspension up to 10 years, or revocation.", "FREC must tell the Division of Florida Condominiums whenever it disciplines a licensee."],
    ["FREC composition", "7 members appointed by the governor and confirmed by the senate:\n4 brokers active for the past 5 years\n1 broker or sales associate active for the past 2 years\n2 lay members never licensed", "At least one member must be 60 or older."],
    ["FREC terms", "4-year terms, staggered so no more than two expire in one year.", "No more than two consecutive terms, but no maximum number of years overall. A replacement serves the rest of the term."],
    ["FREC meetings", "At least once a month, usually in the Division offices in Orlando. A chairperson and vice chairperson are elected each year.", "A quorum, a majority (4 of 7), must be present to act."],
    ["CE credit for attending FREC", "Licensees can earn 3 hours of specialty CE per renewal cycle by attending one legal docket session.", "The legal docket is the first day of a two-day meeting. Contact the Division in advance."],
    ["Prima facie evidence", "Latin for \"on the face of it.\" FREC's certified documents are presumed true unless other evidence contradicts them.", "A rebuttable presumption. Certificates are signed by the chair or vice chair and bear the official seal."],
    ["Initial license expiration", "Valid for a maximum of 2 years. All licenses expire on either March 31 or September 30.", "Example: issued April 15, 2023, it expires March 31, 2025. September 30, 2025 would be over the 2-year maximum."],
    ["Initial issue", "The first license in a category, issued when the applicant passes the state exam. It starts inactive.", "It becomes active once employment is filed on the DBPR transaction form."],
    ["Renewal", "Replaces the prior license and lasts 2 years. DBPR mails a renewal notice about 60 days before expiration to the last known address.", "Renew before expiration, with the fee and an affirmation that post-license or CE is done."],
    ["Missing the first renewal", "The license becomes null and void. A sales associate has to start over with a new initial license.", "A broker can instead revert to a sales associate by completing 14 hours of CE within 6 months. Your note: failing to renew = null and void."],
    ["Subsequent renewals", "Complete the 14-hour CE before each renewal after the first.", "Miss it and the license goes involuntary inactive (up to 2 years)."],
    ["Military licensees", "May keep their license in good standing without renewing or paying fees for 2 years after discharge, if they don't practice real estate.", "Spouses stationed outside Florida are exempt while married and for 2 years after discharge. F.S. 455.02"],
    ["Reissue", "A new license issued when the licensee's information changes, like a name or address, or when one is lost.", "Notify the Department within 10 days of a change. Your note: request a reissued license after updating information."],
    ["Active license", "Required to perform real estate services. Passing the exam and filing employment with a broker or owner-developer makes it active.", "Keeping it active means completing education, paying fees and renewing on time."],
    ["Ceases to be in force", "A sales associate's license status when they change employers, until the change is filed.", "Notify the Commission no later than 10 days after the change."],
    ["Inactive license", "Can't legally be used to perform real estate services for compensation.", "There are two types: voluntary inactive and involuntary inactive."],
    ["Voluntary inactive", "The licensee chooses not to practice, but still pays fees, completes CE and renews on time.", "Can stay this way indefinitely and activate any time by filing a DBPR transaction form."],
    ["Involuntary inactive", "The licensee didn't renew a second or later license, or didn't meet CE.", "Your note: you don't renew. Can stay this way up to 2 years."],
    ["Getting out of involuntary inactive", "Months 1–12: 14-hour CE plus a fee.\nMonths 13–24: 28-hour reactivation course plus a fee.", "Not fixed within 2 years? The license automatically expires (null and void). F.S. 475.183(2)"],
    ["Void and ineffective license", "A license that looks valid on its face but isn't. No services can be performed under it.", "If a broker's license is suspended, revoked or void, all of their employees' licenses become automatically inactive."],
    ["Brokerage firm with no active broker", "If a corporation, partnership, LLP or LLC has no active broker registered, the firm's registration and every licensee in the firm become automatically inactive.", "F.S. 475.17"],
    ["Cancelled license", "The licensee decides to stop practicing and returns the license to the Department.", ""],
    ["Current vs ineffective", "Current: the expiration date hasn't passed.\nIneffective (not current): the license wasn't renewed by its expiration date.", "Your note: ineffective = expired."],
    ["Active vs inactive", "Active: current, and employed by a broker or owner-developer.\nInactive: lost employment, didn't renew on time, or chose to be inactive.", "Your note: active and inactive depend on employment."],
    ["Suspended vs revoked", "Suspended: barred from practicing for a period of time.\nRevoked: permanently removed. No longer a licensee.", ""],
    ["Valid vs invalid", "Valid: current, active, and not suspended or revoked.\nInvalid: any one of those conditions is missing.", "A cancelled license is invalid. Licensees may only practice with a valid license."],
    ["Null and void", "A null and void license is no longer valid, and the license holder is out of the real estate business.", "Happens after missing the first-renewal post-license education, or after 2 years of involuntary inactive. Getting back in means starting over."],
    ["Probation", "A penalty that lets the licensee keep practicing under conditions set by FREC.", ""],
    ["Promulgation", "Officially publishing rules or information.", "Part of FREC's executive powers: keeping licensees and the public informed through publications."],
    ["Multiple licenses", "A BROKER can be issued additional licenses to act in two or more capacities, by requesting multiple licenses.", "The broker must show a legitimate business reason that isn't harmful to the public or business associates. Not available to sales associates or broker associates. F.S. 475.215"],
    ["Group license", "One license for a sales associate or broker associate who works for one owner-developer with affiliated organizations providing real estate services in different geographic areas.", "The owner-developer must prove the properties are owned by different entities whose ownership is connected and essentially the same. F.S. 475.215, F.A.C. 61J2-6.006"],
    ["How many employers can a sales associate have?", "Only one registered employer at a time.", "The only exception is a group license with an owner-developer's affiliated companies. Applies to broker associates too."],
    ["Legal advice to DBPR, FREC and the Division", "Provided by the Department of Legal Affairs, part of the Florida Attorney General's office.", "Assistant attorneys may be assigned to the Division in Orlando. Their main purpose is to represent the citizens of Florida."],
    ["Outside counsel", "DBPR can hire outside lawyers and investigators when needed.", "The same outside person can't both give advice and provide legal services in the same matter. F.S. 455.221"]
  ],
  4: [
    ["Common law", "Unwritten law that comes from old English common law and reflects the community's attitudes. Court decisions set precedents that other courts follow.", "Agency law comes from common law. No book can list every situation, so conduct must meet standards society accepts."],
    ["How an agency relationship is created", "By the words or actions of a licensee. No compensation and no written agreement are required.", "Once created, the law imposes duties on the agent, and violating them can have severe consequences."],
    ["Compensatory vs punitive damages", "Compensatory: paid for a loss that can be measured.\nPunitive: additional damages meant to punish the party at fault.", "Both come from civil courts."],
    ["Statutory law", "Written statutes enacted by a unit of government, such as the legislature.", "Enforced by criminal courts with fines and imprisonment. F.S. 455 and F.S. 475 are statutes."],
    ["Administrative law", "Statutes create administrative agencies to administer and enforce laws. DBPR (created by F.S. 455) and FREC (created by F.S. 475) are examples.", "Administrative agencies can also levy fines for violating the rules they administer."],
    ["Law of agency", "The body of law covering the rights, duties and obligations in a principal-agent relationship.", "Your note: employer = principal."],
    ["Agent", "Someone who acts on behalf of, and represents the interests of, another party.", "The relationship is based on trust and confidence, like husband and wife, doctor and patient, or attorney and client."],
    ["Principal", "The employer who hires the agent and gives them some authority to act on their behalf.", "A customer becomes a principal once a single agency relationship is established."],
    ["Special agent", "Authorized to perform ONE specific act. The authority is limited to what was granted.", "Example: a broker hired under a listing to sell one property. Your note: one transaction."],
    ["General agent", "Acts for the principal on a continuing basis, but only within one trade or business.", "Example: a property manager for an investor. A sales associate is a general agent of their broker. Your note: one business."],
    ["Universal agent", "Authorized to act for the principal in ALL matters, without limit. Usually created by a power of attorney.", "A broker can't sign a contract binding their principal unless they have power of attorney."],
    ["The three types of agency", "Special agent, general agent and universal agent.", "Your note: they're distinguished by how much authority is granted to the agent."],
    ["Subagent", "An agent of the agent, working for the principal. Subagency is an extension of another agency, not a separate type.", "A subagent owes the principal the same duties as the agent."],
    ["Brokerage Relationship Disclosure Act", "Took effect October 1, 1997. Its purpose is to tell consumers what brokerage relationships are available and to educate the public.", "Created by the Commission, Florida REALTORS and the Department together. F.S. 475.2701–475.278"],
    ["Customer", "A member of the public who is or may be a buyer or seller. They may or may not be represented by a licensee.", "Nothing in Florida law requires a customer to be represented."],
    ["Single agent", "A broker who represents EITHER the buyer or the seller, but not both in the same transaction.", "Your note: a single agent cannot represent both the buyer and the seller."],
    ["Transaction broker", "A broker who gives limited representation to the buyer, the seller or both, without a fiduciary relationship.", "Your note: serves both the buyer and seller, but only with limited representation. Not a fiduciary."],
    ["Default relationship", "Every licensee is presumed to be a transaction broker unless a single agent or no brokerage relationship is set up in writing.", "F.S. 475.278(1)(b)"],
    ["Fiduciary", "A person placed in a position of trust and confidence who must act in the principal's interest.", "From your note."],
    ["Residential sale", "1–4 unit residential property (improved, or vacant land for 1–4 units), agricultural property of 10 acres or less, leases with an option to buy 1–4 units, or business interests in property of 1–4 units.", "Your note: 4 units or fewer, 10 acres or less."],
    ["Disclosure requirements", "Written disclosure is required for single agency and nonrepresentation in residential sales.", "It isn't required for a transaction broker or for nonresidential deals. Your note: must be disclosed before engagement."],
    ["Duties of ALL licensees", "1. Deal honestly and fairly\n2. Account for all funds\n3. Disclose all known facts that materially affect the value of residential property and aren't readily observable", "These apply in every relationship, including no brokerage relationship."],
    ["Sellers' disclosure duty", "Sellers of residential property, along with licensees, must disclose known facts that materially affect value and aren't readily observable to the buyer.", ""],
    ["Exempt from disclosure (1)", "When the licensee knows the buyer or seller is already represented; new homes sold by a developer's staff when the setting shows who they work for; nonresidential deals; rentals (unless with an option to buy 1–4 units).", "F.S. 475.278(5)(b)"],
    ["Exempt from disclosure (2)", "Bona fide open houses or model homes that don't draw out confidential info; unanticipated casual conversations; answering general factual questions about advertised property.", "Also: general info about the licensee's qualifications, auctions, appraisals, and business sales (except property of 1–4 units)."],
    ["Keeping disclosure documents", "Keep copies for 5 years from the date of execution, for every residential sale that results in a written contract, whether or not it closes.", "F.S. 475.5015"],
    ["Extra duties for transaction brokers and single agents", "Use skill, care and diligence; present all offers and counteroffers in a timely manner, unless told otherwise in writing.", "Licensed professionals are held to a higher standard than the public."],
    ["Presenting offers", "A broker must present ALL offers to their employer, including oral offers and offers with no deposit.", "Not presenting an offer is concealment or a breach of trust. The broker can't accept or reject an offer for the principal without power of attorney or listing terms that allow it."],
    ["Limited confidentiality", "Unless waived in writing, a transaction broker can't disclose: that the seller will take less than the asking price, that the buyer will pay more than their offer, either party's motivation, that a party will accept other financing terms, or anything a party asks to keep confidential.", "Duty 6 on the Consent to Transition form."],
    ["Transaction broker and loyalty", "A transaction broker has no fiduciary duty to either party. Neither buyer nor seller is responsible for the broker's actions.", "Customers give up the right to undivided loyalty. The broker can't favor one party over the other."],
    ["Single agency relationship", "Created when a broker accepts employment under a single agency agreement to represent a seller OR a buyer.", "Trying to represent both is illegal dual agency."],
    ["Principal's liability", "The principal can be held responsible for statements and actions of the licensee acting for them.", "Example: if the agent misstates something about the seller's property, the seller could be liable."],
    ["Sales associates and the principal", "A sales associate or broker associate is registered with the broker as the broker's agent, and is never an agent of the broker's principal.", "Your note: principal → broker → sales associate. In the book's diagram, the sales associate is a subagent of the broker's principal, but never a direct agent of that principal."],
    ["Single agent's duties", "Deal honestly and fairly; loyalty; confidentiality; obedience; full disclosure; account for all funds; skill, care and diligence; present all offers; disclose known facts affecting value.", "F.S. 475.278(3)(a)"],
    ["Confidentiality (fiduciary duty)", "Keep any harmful information about the principal confidential, even after the relationship ends.", "Material defects in a property are NOT confidential and must be disclosed."],
    ["Obedience (fiduciary duty)", "Obey all legal instructions of the principal.", "If the principal insists on something illegal, the agent must withdraw."],
    ["Loyalty (fiduciary duty)", "Act in the principal's best interest, above anyone else's, including the agent's own.", "Seller's agent: try for the highest price. Buyer's agent: try for the lowest price."],
    ["Full disclosure (fiduciary duty)", "Report any fact or rumor to the principal that might affect their decision.", "The principal may rely on the agent's statements without checking them."],
    ["Breach of fiduciary duty", "The principal can sue for damages in civil court, and it may also be a crime.", "The licensee can also face discipline by FREC."],
    ["Single Agent Notice", "Single agent duties must be disclosed in writing, either as a separate form or within a listing or representation agreement.", "Complete it before or when signing the agreement, or before showing property, whichever comes first."],
    ["Single Agent Notice formatting", "If included in another document, the first sentence must be in bold UPPERCASE and at least as large as the rest of the text.", "You don't need to list every associate. \"And its associates\" is enough."],
    ["In-house transaction", "When the same brokerage lists and sells a property.", "A single agent for both sides would be illegal dual agency, so the broker transitions to transaction broker."],
    ["Consent to Transition to Transaction Broker", "Written consent from the principal to change from single agent to transaction broker. The only disclosure form that must be signed or initialed.", "Can be done at any time. The principal becomes a customer. First sentence in bold uppercase, same as the Single Agent Notice."],
    ["Illegal dual agency", "A broker trying to act as single agent for both the buyer and the seller in the same transaction.", ""],
    ["Limited representation", "The buyer or seller is not responsible for the licensee's acts, and gives up the right to the licensee's undivided loyalty.", "It lets the licensee help both buyer and seller, but never to the detriment of the other party."],
    ["Designated sales associates", "In a NONRESIDENTIAL sale where buyer and seller each have assets of $1 million or more and both ask for single agent representation, the broker may designate one sales associate as single agent for each.", "Technically a dual agency the law allows here. It must be disclosed in writing, and both parties sign to confirm their assets. The broker advises both associates; information they learn stays confidential. F.S. 475.2755"],
    ["Confidentiality after transitioning", "Moving from single agent to transaction broker does NOT end the confidentiality created during the single agency.", "The licensee still can't use or disclose that confidential information."],
    ["Nonrepresentation (no brokerage relationship)", "The broker may provide specified services to a customer for a fee, without representing them.", "Avoid words or actions that suggest representation. That can create an implied agency, with fiduciary duties and possible civil damages. F.S. 475.278(4)"],
    ["No Brokerage Relationship Notice", "Must be given in writing BEFORE showing property to a customer with no brokerage relationship. It does NOT need to be signed.", "Lists 3 duties. The first sentence must be in bold uppercase. Note the date and time it was given, and keep a copy in the transaction file."],
    ["Duties by relationship: nonrepresentation", "1. Deal honestly and fairly\n2. Account for all funds\n3. Disclose known facts affecting the value of residential property", "3 duties. From the summary table."],
    ["Duties by relationship: transaction broker", "The 3 basic duties, plus:\nSkill, care and diligence\nPresent all offers and counteroffers\nLimited confidentiality\nAny additional agreed duties", "7 duties."],
    ["Duties by relationship: single agent", "The 3 basic duties, plus:\nSkill, care and diligence\nPresent all offers and counteroffers\nConfidentiality\nObedience\nLoyalty\nFull disclosure", "9 duties."],
    ["Disclosure forms and how many duties", "No Brokerage Relationship Notice: 3 duties, no signature needed.\nSingle Agent Notice: 9 duties.\nConsent to Transition: 7 duties, must be initialed or signed.", ""],
    ["Nonresidential sales", "The written disclosure requirements do NOT apply: commercial and industrial deals, auctions, appraisals, nonresidential leases and business sales.", "Brokers still have to pick a relationship (transaction broker, single agent or nonrepresentation) and owe its duties."],
    ["Arm's length relationship", "Each party acts in their own best interest. The opposite of a fiduciary relationship.", "Licensees may NEVER deal at arm's length, because the law requires fairness and honesty. Your note: arm's length = opposing interests."],
    ["Policy and procedures manual", "Each brokerage SHOULD have one to guide its associates. Not required by law, and not every office has one.", "It can protect the broker from future liability and help prevent disagreements. The office's policy on representation should be in writing."],
    ["Licensees in a brokerage office", "Agents of the broker, and subagents of the broker's buyer or seller.", "They owe the broker's principals the same duties the broker does."],
    ["Multiple listing service (MLS) and subagency", "A listing broker can use the MLS to offer subagency or compensation to cooperating brokers, transaction brokers or buyer's brokers.", "The fee split can be the same or different for each. A cooperating broker can decline subagency and work as a buyer's single agent, transaction broker, or with no brokerage relationship."],
    ["Caveat emptor", "\"Let the buyer beware.\"", "Arm's length, buyer beware and caveat emptor describe opposing parties. Fiduciary is the opposite: trust."]
  ],
  5: [
    ["Principal office", "Every active broker must open and keep an office registered with DBPR. It must have at least one enclosed room in a stationary building where negotiations and closings can happen privately.", "No phone, desk or checking account is required. The registration can move to a new location for the rest of the license period. F.S. 475.22"],
    ["Office in the broker's home", "Allowed, as long as it doesn't conflict with local zoning ordinances.", "F.A.C. 61J2-10.022"],
    ["Keeping books and records", "A broker must keep books, records and files for transactions for at least 5 years.", ""],
    ["Branch office", "Any additional office where the broker does business must be registered as a branch office and its fee paid.", "Each branch is registered by location. A branch registration can't be transferred. If a branch moves, a new application and fee are needed."],
    ["Branch office closed and reopened", "If it reopens in the same location during the same 2-year license period, the registration can be reissued without paying again.", ""],
    ["Temporary shelter: branch office?", "Not one, unless sales associates or broker associates are permanently assigned there.", "Permanence, use and the activities there determine whether registration is required. F.A.C. 61J2-10.023"],
    ["Office sign", "Required on or around the entrance of every office and branch, easily seen by people entering. Exterior or interior.", "Sole proprietor: the broker's name (or trade name) and \"Licensed (Lic.) Real Estate Broker.\" Partnership or corporation: the firm name, at least one broker's name, and \"Licensed Real Estate Broker.\""],
    ["Associates' names on the sign", "Names of other brokers, sales associates and broker associates may appear on the sign.", "They must be placed beneath the required text and clearly separated, and each person's licensed status must be shown. F.S. 475.22"],
    ["Advertising rule", "All legal advertising must be in the name, and under the supervision, of the broker, so a reasonable person knows they're dealing with a licensee.", "Every ad (yard signs, newspaper, business cards and more) must include the brokerage's registered name or trade name. Anyone may write ad copy, but the broker is responsible."],
    ["Associate's name in ads", "A sales associate's or broker associate's name may appear, but the brokerage name must too.", "If personal names are used, the last name must appear exactly as registered with the Commission. Advertising your own listings without the broker's name is acting as a broker."],
    ["Institutional advertising", "Advertising that creates an image for a brand or company, not a particular product.", "Example: a franchise's image ad."],
    ["Specific (product) advertising", "Advertising designed to sell a particular product or service.", "Example: an ad featuring a specific home for sale."],
    ["Internet advertising", "Must follow the same rules as printed ads. The brokerage name must be next to, directly above or below the point of contact information.", "Point of contact information: mailing address, phone, fax or email. F.A.C. 61J2-10.025(3)"],
    ["Blind ad", "An illegal ad that leaves out the broker's registered or trade name, or leaves doubt that it's from a real estate broker.", "F.A.C. 61J2-10.025(2)"],
    ["Team advertising", "A team or group name or logo used by licensees under the same broker.", "Must include \"team\" or \"group\" and can't use words like Brokerage, Realty, Properties or Associates. The broker keeps a written record of each team; one designated member is filed with the broker. F.A.C. 61J2-10.026"],
    ["False advertising", "No ad may be fraudulent, false, deceptive or misleading.", "Example: only NAR members may call themselves REALTORS®. F.S. 475.42(1)(n)"],
    ["Licensees selling their own property", "Allowed, but they must make clear they're a licensee acting for themselves, in writing, before serious negotiations.", "To advertise: 1) as an individual, without mentioning the license, or 2) through their brokerage, following normal advertising rules."],
    ["Telephone solicitation", "Calls to get new customers are regulated by state and federal law, including the Do Not Call lists.", "Stiff penalties. Covered more in Chapter 7."],
    ["Escrow funds", "Funds held by a third party for two parties in a transaction until the contract's obligations are met.", "The broker can be the third party, or a title company or attorney can."],
    ["Earnest money deposit", "A deposit that shows the buyer's good faith, usually given with an offer.", "No contract: it goes back to the buyer. If the buyer defaults, it usually goes to the seller as liquidated damages."],
    ["What can be a deposit?", "Money, personal property, real property, or anything else of value that can become cash.", "Postdated checks count as promissory notes and need the seller's approval."],
    ["Bounced deposit check", "The broker isn't responsible if a personal check bounces, as long as it was deposited immediately.", "F.A.C. 61J2-14.008(1)(b)"],
    ["Deposit held by a title company or attorney", "The buyer's broker must verify the deposit in writing within 10 business days of when it was due.", "If it isn't verified, the broker notifies the seller's broker (or the seller) in writing. F.A.C. 61J2-14.008(2)(b)"],
    ["Escrow (trust) account", "A separate account for escrowed funds in a Florida commercial bank, credit union, savings and loan, or title company with trust powers.", "Brokers don't have to have one. If they do, it can't be in a stock or bond brokerage house."],
    ["Commingling", "Mixing personal funds with escrowed funds. Illegal.", "Exceptions: up to $1,000 of the broker's money in a sales escrow account, and up to $5,000 in a property management account, to cover service charges. F.A.C. 61J2-14.010(2)"],
    ["Conversion", "Misusing or keeping funds or property that belong to someone else. A form of fraud.", "Example: a broker who collects a commission and doesn't pay the other broker's share."],
    ["Interest-bearing escrow account", "Allowed only with written agreement from all interested parties saying who gets the interest.", "Can't be held in a stock or bond brokerage."],
    ["Depositing escrow funds: sales associate", "Must give the deposit to their broker no later than the end of the next business day.", "Weekends and legal holidays don't count as business days."],
    ["\"Immediately\" (escrow)", "The broker must deposit the funds no later than the end of the third business day after receiving them.", "Example timeline: associate gets it Tuesday, broker by Wednesday, deposited by Friday. F.A.C. 61J2-14.008"],
    ["Monthly reconciliation", "The broker compares the bank statement, the checkbook balance and the total trust liability every month, in writing, and signs and dates it.", "Any difference must be explained and corrected. Records can be inspected by DBPR at reasonable times."],
    ["Escrow record keeping", "Keep escrow records at least 5 years. If used in litigation, keep them 2 years after it ends.", "The broker is ultimately responsible for the escrow account and must be a signatory."],
    ["Escrow agent", "A broker holding escrow is an escrow agent for both parties.", "Until a binding contract exists, the money still belongs to the buyer."],
    ["Escrow dispute", "Buyer and seller both demand the funds (conflicting demands), or the broker has a good-faith doubt about who is entitled to them.", "Notify FREC in writing within 15 business days, and start a settlement procedure within 30 business days of the last party's demand."],
    ["Good-faith doubt", "When the broker honestly isn't sure who should get escrowed funds.", "Treated like conflicting demands: the same notice and settlement deadlines apply."],
    ["Settlement procedures: MEAL", "Mediation\nEscrow Disbursement Order\nArbitration\nLitigation (court action)", "Also called escape procedures. Using one protects the broker from being charged with failure to account."],

function deckFor(ch){
  const own=DECKS[ch]||[];
  if(own.length) return own.map((c,i)=>({id:`f${ch}-${i}`,ch,num:i+1,front:c[0],back:c[1],note:c[2]||"",custom:true}));
  return Q.filter(q=>q.ch===ch).map(q=>({id:`q${q.id}`,ch,num:q.num,front:q.q,back:q.o[q.a],key:L[q.a],note:q.why,custom:false}));
}

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let missed=new Set(store.get("flre-missed",[]));
const S={chapter:"all",mode:"practice",shuffle:false,list:[],i:0,answers:{},submitted:false,flipped:false};
const $=s=>document.querySelector(s);
const L="abcd";

function buildChapters(){
  const box=$("#chapters");
  const opts=[["all","All",Q.length],...CHS.map(n=>[String(n),"Ch "+n,Q.filter(q=>q.ch===n).length])];
  box.innerHTML=opts.map(([v,t,n])=>`<button class="chip" data-ch="${v}" title="${v==="all"?"All chapters":CH[v]}">${t}<span class="n">${n}</span></button>`).join("");
  box.onclick=e=>{const b=e.target.closest("[data-ch]");if(!b)return;S.chapter=b.dataset.ch;start();};
}
function pool(){
  let p=Q.filter(q=>S.chapter==="all"||String(q.ch)===S.chapter);
  if(S.mode==="missed")p=p.filter(q=>missed.has(q.id));
  if(S.mode==="flash")p=CHS.filter(c=>S.chapter==="all"||String(c)===S.chapter).flatMap(deckFor);
  if(S.shuffle){p=p.slice();for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}}
  return p;
}
function start(){S.list=pool();S.i=0;S.answers={};S.submitted=false;S.flipped=false;render();}
function saveMissed(){store.set("flre-missed",[...missed]);}

function syncChips(){
  document.querySelectorAll("[data-ch]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ch===S.chapter));
  document.querySelectorAll("[data-ch]").forEach(b=>{const chs=b.dataset.ch==="all"?CHS:[+b.dataset.ch];
    b.querySelector(".n").textContent=chs.reduce((t,c)=>t+(S.mode==="flash"?deckFor(c).length:Q.filter(q=>q.ch===c).length),0);});
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
  $("#shuffle").setAttribute("aria-pressed",S.shuffle);
  $("#missedN").textContent=missed.size;
}

function render(){
  syncChips();
  const main=$("#main");
  if(!S.list.length){
    main.innerHTML=`<div class="empty">${S.mode==="missed"?"No missed questions here yet. Anything you get wrong in Practice or Exam mode shows up in this list.":`${S.chapter!=="all"&&!Q.some(q=>String(q.ch)===S.chapter)?`No practice questions for Chapter ${S.chapter} yet. Switch to Flashcards to study it.`:"No questions match."}`}</div>`;
    $("#qLabel").textContent="Question"; $("#qCount").textContent="";
    $("#rail").innerHTML=""; renderStats(); return;
  }
  if(S.mode==="exam"&&S.submitted&&S.i===-1){renderScore();return;}
  if(S.mode==="flash"){renderFlash();return;}
  const q=S.list[S.i], picked=S.answers[q.id];
  const reveal = S.mode!=="exam" ? picked!==undefined : S.submitted;
  const optsHtml=q.o.map((t,k)=>{
    let cls="opt", tag="";
    if(reveal){ if(k===q.a){cls+=" right";tag="Correct";} else if(k===picked){cls+=" wrong";tag="Your answer";} }
    else if(k===picked){cls+=" sel";tag="Selected";}
    return `<button class="${cls}" data-k="${k}" ${reveal?"disabled":""}><span class="k">${L[k]}</span><span class="txt">${t}</span><span class="tag">${tag}</span></button>`;
  }).join("");
  let why="";
  if(reveal){
    const ok=picked===q.a;
    why=`<div class="why"><strong>${picked===undefined?"Not answered.":ok?"Correct.":"Incorrect."} The answer is ${L[q.a]}.</strong><p>${q.why}</p></div>`;
  }
  const last=S.i===S.list.length-1;
  let right;
  if(S.mode==="exam"&&!S.submitted) right = (last?"":`<button class="btn" id="submit">Submit exam</button>`) +
      (last?`<button class="btn primary" id="submit">Submit exam</button>`:`<button class="btn primary" id="next">Next</button>`);
  else if(S.mode==="exam") right = `<button class="btn primary" id="toScore">Back to score</button>`;
  else right = `<button class="btn primary" id="next" ${last?"disabled":""}>Next</button>`;
  $("#qLabel").textContent=`Chapter ${q.ch} · ${CH[q.ch]}`;
  $("#qCount").textContent=`Q${q.num} · ${S.i+1} of ${S.list.length}`;
  main.innerHTML=`<article class="card" aria-live="polite">
    <h2 class="qtext">${q.q}</h2>
    <div class="opts">${optsHtml}</div>${why}
    <div class="nav"><button class="btn" id="prev" ${S.i===0?"disabled":""}>Back</button><div class="right">${right}</div></div>
  </article>`;
  main.querySelector(".opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;choose(+b.dataset.k);};
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  on("prev",()=>{S.i--;render();});
  on("next",()=>{S.i++;render();});
  on("submit",submitExam);
  on("toScore",()=>{S.i=-1;render();});
  renderRail();
}
function renderFlash(){
  const c=S.list[S.i], last=S.i===S.list.length-1, f=S.flipped;
  $("#qLabel").textContent=`Flashcards · Chapter ${c.ch} · ${CH[c.ch]}`;
  $("#qCount").textContent=`Card ${S.i+1} of ${S.list.length}`;
  const face = f
    ? `<span class="side">Back</span><span class="fa">${c.key?`<span class="k">${c.key}</span>`:""}${c.back.replace(/\n/g,"<br>")}</span>${c.note?`<span class="fw">${c.note}</span>`:""}`
    : `<span class="side">Front</span><span class="fq">${c.front}</span><span class="hint">Tap the card or press Space to flip</span>`;
  const right = f
    ? `<button class="btn" id="learn">Still learning</button><button class="btn primary" id="know">Know it</button>`
    : `<button class="btn" id="skip" ${last?"disabled":""}>Skip</button><button class="btn primary" id="flipBtn">Flip</button>`;
  $("#main").innerHTML=`<article class="card">
    <button class="flash${f?" back":""}" id="flip" aria-label="${f?"Show front":"Show back"}" aria-live="polite">${face}</button>
    <div class="nav"><button class="btn" id="prev" ${S.i===0?"disabled":""}>Back</button><div class="right">${right}</div></div>
  </article>`;
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  const flip=()=>{S.flipped=!S.flipped;renderFlash();document.getElementById("flip").focus();};
  const go=d=>{S.i+=d;S.flipped=false;render();};
  const mark=k=>{ S.answers[c.id]=k?"know":"learn"; if(!last)go(1); else render(); };
  on("flip",flip); on("flipBtn",flip);
  on("prev",()=>go(-1)); on("skip",()=>go(1));
  on("know",()=>mark(true)); on("learn",()=>mark(false));
  renderRail();
}
const isRight=q=>S.mode==="flash"?S.answers[q.id]==="know":S.answers[q.id]===q.a;
function renderStats(){
  const fl=S.mode==="flash";
  $("#sRightL").textContent=fl?"Known":"Correct";
  $("#lgOk").textContent=fl?"Know it":"Correct";
  $("#lgNo").textContent=fl?"Still learning":"Missed";
  const ids=S.list.map(q=>q.id).filter(id=>S.answers[id]!==undefined);
  const reveal=S.mode!=="exam"||S.submitted;
  const right=S.list.filter(isRight).length;
  $("#sDone").textContent=`${ids.length}/${S.list.length}`;
  $("#sRight").textContent=reveal?right:"–";
  $("#sPct").textContent=reveal&&ids.length?Math.round(right/ids.length*100)+"%":"–";
}
function choose(k){
  const q=S.list[S.i];
  S.answers[q.id]=k;
  if(S.mode!=="exam"){
    if(k===q.a){ if(S.mode==="missed")missed.delete(q.id); } else missed.add(q.id);
    saveMissed();
  }
  render();
}
function submitExam(){
  S.submitted=true;
  S.list.forEach(q=>{ if(S.answers[q.id]===q.a)missed.delete(q.id); else missed.add(q.id); });
  saveMissed(); S.i=-1; render();
}
function renderRail(){
  $("#rail").innerHTML=S.list.map((q,i)=>{
    const p=S.answers[q.id]; let c="dot";
    const reveal=S.mode!=="exam"||S.submitted;
    if(p!==undefined)c+=reveal?(isRight(q)?" ok":" no"):" ans";
    if(i===S.i)c+=" cur";
    return `<button class="${c}" data-i="${i}" aria-label="${S.mode==="flash"?"Card":"Question"} ${i+1}">${i+1}</button>`;
  }).join("");
  $("#rail").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;S.i=+b.dataset.i;S.flipped=false;render();};
  renderStats();
}
function renderScore(){
  const tot=S.list.length, right=S.list.filter(q=>S.answers[q.id]===q.a).length, pct=Math.round(right/tot*100);
  const by=CHS.map(c=>{const qs=S.list.filter(q=>q.ch===c);return {c,n:qs.length,r:qs.filter(q=>S.answers[q.id]===q.a).length};}).filter(x=>x.n);
  $("#qLabel").textContent="Exam results"; $("#qCount").textContent=`${right} of ${tot} correct`;
  $("#main").innerHTML=`<div class="score">
    <div class="big">${pct}%</div>
    <div class="pass">${pct>=75?"Passing. The state exam requires 75%.":"Below the 75% the state exam requires. Review the missed questions in Progress below."}</div>
    <div class="bars">${by.map(b=>`<div class="bar"><span>Chapter ${b.c}</span><div class="track"><div class="fill" style="width:${b.r/b.n*100}%"></div></div><span class="v">${b.r}/${b.n}</span></div>`).join("")}</div>
    <div class="nav"><button class="btn" id="review">Review answers</button><button class="btn primary" id="again">Retake</button></div>
  </div>`;
  $("#review").onclick=()=>{S.i=0;render();};
  $("#again").onclick=start;
  renderRail();
}

document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;start();});
$("#shuffle").onclick=()=>{S.shuffle=!S.shuffle;start();};
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if(S.mode==="flash"&&(e.key===" "||e.key==="Enter")&&e.target.id!=="flip"&&!e.target.closest("button")){e.preventDefault();document.getElementById("flip")?.click();return;}
  if(S.mode==="flash"&&e.key===" "&&e.target.id==="flip")return;
  const k="abcd1234".indexOf(e.key.toLowerCase());
  if(k>=0&&S.i>=0){const b=document.querySelector(`.opt[data-k="${k%4}"]`);if(b&&!b.disabled)b.click();}
  if(e.key==="ArrowRight"){const n=document.getElementById(S.mode==="flash"?"skip":"next");if(n&&!n.disabled)n.click();}
  if(e.key==="ArrowLeft"){const p=document.getElementById("prev");if(p&&!p.disabled)p.click();}
});
buildChapters(); start();
</script>
